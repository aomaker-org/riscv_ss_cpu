# This file will store combined log entries in YAML format.
#
# Log Types:
# - interact: Records interactions between user and agent.
#   Fields: id, timestamp, source ('user' or 'agent'), message
# - dev: Records development actions, decisions, or findings.
#   Fields: id, timestamp, component, message, details (object)
# - run: Records execution of commands or scripts.
#   Fields: id, timestamp, component, event, script_name, details (object)
# - test: Records test execution details.
#   Fields: id, timestamp, test_case, status, duration_ms, details (object)
# - backlog: For tasks, ideas, or features noted but not immediately actioned.
#   Fields: id, timestamp, item_type ('feature_request', 'idea', 'task_deferred'),
#           summary, details, priority ('low', 'medium', 'high')
# - bot_status: Records the bot's understanding of its current state.
#   Fields: id, timestamp, current_plan_step, active_task_summary,
#           blocked_on (optional), recent_decisions (list), overall_goal
#
# Example entry structures:
# - id: 50701.001.interact
#   timestamp: 'YYYY-MM-DDTHH:MM:SSZ'
#   source: 'user'
#   message: 'Initial request.'
# - id: 50701.002.dev
#   timestamp: 'YYYY-MM-DDTHH:MM:SSZ'
#   component: 'logging_setup'
#   message: 'Created directory.'
#   details:
#     action: 'create_directory'
#     path: 'jules/logs'
# - id: 50701.005.backlog
#   timestamp: 'YYYY-MM-DDTHH:MM:SSZ'
#   item_type: 'feature_request'
#   summary: 'Brief description.'
#   details: 'More detailed explanation.'
#   priority: 'medium'
# - id: 50701.006.bot_status
#   timestamp: 'YYYY-MM-DDTHH:MM:SSZ'
#   current_plan_step: "Example: 3a - Create Dockerfile"
#   active_task_summary: "Setting up QEMU emulation for hello.c via Docker."
#   blocked_on: "User input for X" # Optional
#   recent_decisions:
#     - "Decided to use QEMU due to missing HDL components."
#     - "Added new 'bot_status' log type."
#   overall_goal: "Assist user with RISC-V project, currently focusing on QEMU setup."

